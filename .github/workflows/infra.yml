name: infra

# Pipeline de infraestructura. Es dueno de la existencia y la configuracion
# de la funcion, y no toca la imagen.

on:
  pull_request:
    paths:
      - 'infra/**'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
  workflow_dispatch:
    inputs:
      autorizar_destruccion:
        # Autorizacion humana y explicita para un plan que destruye o
        # reemplaza recursos. Solo existe en una ejecucion manual: no puede
        # venir del codigo ni del propio plan.
        description: 'Autorizo que este plan destruya o reemplace recursos'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:

  # Sintaxis e integridad: formato, init contra el backend remoto y validacion.
  # Condicion de detencion: cualquiera de las comprobaciones falla.
  # La configuracion del backend llega por archivo (backend.hcl).
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Formato
        run: terraform fmt -check -recursive

      - name: Inicializar Terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validar Terraform
        run: terraform validate

  # Politicas de IaC sobre el codigo declarado en infra/.
  # Condicion de detencion: hallazgo HIGH o CRITICAL no exceptuado.
  # Las excepciones van junto al recurso, con identificador, razon,
  # responsable y vencimiento (ver la anotacion existente en infra/main.tf).
  politicas:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Analizar politicas de infraestructura
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL   # umbral de detencion
          exit-code: '1'            # esta compuerta detiene
          format: table
          output: trivy-iac.txt
          hide-progress: true

      - name: Hallazgos visibles en la ejecucion
        if: always()
        run: |
          [ -s trivy-iac.txt ] || exit 0
          cat trivy-iac.txt
          {
            echo "## Politicas IaC (umbral: HIGH, CRITICAL)"
            echo '```'
            cat trivy-iac.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Plan y compuerta sobre el plan.
  # El plan se guarda en disco (tfplan) y se exporta a tfplan.json; el que se
  # aplica despues es este, no uno recalculado.
  #
  # Regla 2 (informa): el plan legible se publica en el PR. Corre antes que
  #   la regla 1 para que quede visible aunque la compuerta detenga.
  # Regla 1 (detiene): ninguna accion delete (un reemplazo cuenta) sin
  #   autorizacion humana, que solo existe en una ejecucion manual.
  plan:
    needs: [validar, politicas]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Sin el wrapper, la redireccion de 'terraform show' produce
          # archivos limpios (JSON valido y texto sin anotaciones extra).
          terraform_wrapper: false

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar Terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Calcular plan
        run: terraform plan -input=false -out=tfplan

      - name: Exportar plan JSON
        run: terraform show -json tfplan > tfplan.json

      - name: Exportar plan legible
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Plan visible en la ejecucion
        run: |
          {
            echo "## Terraform plan"
            echo '```terraform'
            cat tfplan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Regla 2: publicar el plan en el PR (informa, no detiene).
      # Actualiza el comentario anterior en vez de acumular uno por push.
      - name: Publicar plan en el pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/tfplan.txt', 'utf8');

            const maxLength = 60000;
            const contenido = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... Plan truncado por limite de GitHub ...'
              : plan;

            const marca = '<!-- terraform-plan -->';
            const body = [
              marca,
              '## Terraform plan',
              `Commit: \`${context.sha.substring(0, 7)}\``,
              '',
              '```terraform',
              contenido,
              '```'
            ].join('\n');

            const { data: comentarios } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const previo = comentarios.find(c => c.body && c.body.includes(marca));

            if (previo) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previo.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Regla 1: detectar destrucciones en el efecto calculado del plan.
      # Un reemplazo aparece como ["delete","create"] o ["create","delete"].
      - name: Detectar destrucciones
        id: destrucciones
        run: |
          if jq -e '[.resource_changes[]?.change.actions[]? | select(. == "delete")] | length > 0' tfplan.json > /dev/null; then
            echo "destruccion=true" >> "$GITHUB_OUTPUT"
            {
              echo "## Destrucciones en el plan"
              jq -r '.resource_changes[]?
                     | select(.change.actions | index("delete"))
                     | "- `\(.address)`: \(.change.actions | join(", "))"' tfplan.json
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '.resource_changes[]?
                   | select(.change.actions | index("delete"))
                   | "::warning title=Destruccion en el plan::\(.address): \(.change.actions | join(", "))"' tfplan.json
          else
            echo "destruccion=false" >> "$GITHUB_OUTPUT"
            echo "El plan no contiene acciones de destruccion."
          fi

      - name: Publicar el plan guardado
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: |
            infra/tfplan
            infra/tfplan.json
            infra/tfplan.txt
          if-no-files-found: error

      - name: Bloquear destruccion no autorizada
        if: >-
          steps.destrucciones.outputs.destruccion == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.autorizar_destruccion)
        run: |
          echo "::error::El plan destruye o reemplaza recursos. Para autorizarlo, ejecutar el workflow manualmente con 'autorizar_destruccion'."
          exit 1

  # Aplicacion del plan guardado por el job anterior, sin recalcularlo.
  # Corre solo desde la rama principal y solo si la compuerta del plan paso.
  # Condicion de detencion: el apply falla.
  aplicar:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Inicializar Terraform
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Descargar el plan guardado
        uses: actions/download-artifact@v7
        with:
          name: terraform-plan
          path: infra

      # Aplicar un archivo de plan ejecuta exactamente ese plan: no recalcula.
      # Si el estado cambio desde que se calculo, Terraform lo rechaza.
      - name: Aplicar el plan guardado
        run: terraform apply -input=false tfplan