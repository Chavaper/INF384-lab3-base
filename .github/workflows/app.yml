name: app

# Pipeline de aplicacion. Es dueno de la imagen que ejecuta la funcion y no
# toca la infraestructura.
#
# De las cuatro gates, solo `secretos` detiene el pipeline. Las otras
# tres informan y dejan pasar: el hallazgo tiene que quedar visible en la
# ejecucion, no enterrado en el log.
#
# El repositorio no tiene archivo de excepciones. Un hallazgo que se decida
# no corregir se anota donde se produce: junto a la linea de codigo que lo
# origina, o en el paso del pipeline que lo detecta cuando el hallazgo no
# corresponde a ninguna linea. La anotacion lleva identificador del hallazgo,
# razon, responsable y fecha de vencimiento. Las cuatro, siempre.
#
# En los jobs sin implementar, preferir una action del marketplace o la
# imagen oficial de la herramienta antes que instalarla paso a paso en el
# runner. La guia del laboratorio lista las referencias disponibles.

on:
  push:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile'
  workflow_dispatch:

jobs:

  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar desde el lock file
        run: npm ci

      - name: Pruebas con reporte de cobertura
        run: npm run test:coverage

      - name: Subir el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          if-no-files-found: error

  # Calidad: cobertura y reglas sobre el codigo nuevo.
  # Compuerta informativa: el resultado queda en SonarQube Cloud y en el
  # resumen de la ejecucion.
  calidad:
    needs: pruebas   # solo para recibir el reporte de cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # historial completo para identificar codigo nuevo

      - name: Descargar el reporte de cobertura
        uses: actions/download-artifact@v7
        with:
          name: cobertura
          path: coverage/

      - name: Analisis en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true   # informa, no detiene
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

      - name: Resultado visible en la ejecucion
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT: ${{ vars.SONAR_PROJECT_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then q="projectKey=$PROJECT&pullRequest=$PR"
          else q="projectKey=$PROJECT&branch=$GITHUB_REF_NAME"; fi
          status=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?$q" \
            | jq -r '.projectStatus.status // "DESCONOCIDO"')
          url="https://sonarcloud.io/dashboard?id=$PROJECT"
          {
            echo "## Calidad (SonarQube Cloud)"
            echo "Quality gate: **$status** · [Ver el analisis]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "OK" ]; then
            echo "::warning title=Quality gate $status::El codigo nuevo no cumple la quality gate. Detalle en $url"
          fi

  # Secretos: credenciales en el codigo y en el historial.
  # Unica compuerta que detiene: cualquier hallazgo falla el job.
  # Una credencial no se exceptua: se retira del codigo y del historial,
  # y se rota en el origen.
  secretos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # para comentar los hallazgos en el PR
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # historial completo, no solo el ultimo commit

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # solo si el repo es de una organizacion
          GITLEAKS_ENABLE_SUMMARY: true   # tabla de hallazgos en el resumen

  # Dependencias: arbol completo del lock file contra vulnerabilidades conocidas.
  # Compuerta informativa.
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Excepciones (si se decide no corregir), una por linea:
      # <ID del hallazgo> | razon: ... | responsable: ... | vence: AAAA-MM-DD
      - name: Trivy sobre package-lock.json
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          # Trivy omite las dependencias de desarrollo de npm por defecto.
          # Sin esto el alcance queda incompleto y el informe trae un solo hallazgo.
          TRIVY_INCLUDE_DEV_DEPS: true
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: json
          output: trivy.json
          exit-code: '0'   # informa, no detiene

      - name: Hallazgos visibles en la ejecucion
        if: always()
        run: |
          [ -f trivy.json ] || exit 0
          n=$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy.json)
          echo "## Dependencias: $n vulnerabilidad(es)" >> "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 0 ] && exit 0
          {
            echo "| ID | Paquete | Instalada | Corregida en | Severidad |"
            echo "|---|---|---|---|---|"
            jq -r '.Results[]?.Vulnerabilities[]?
                   | "| [\(.VulnerabilityID)](\(.PrimaryURL // "")) | \(.PkgName) | \(.InstalledVersion) | \(.FixedVersion // "-") | \(.Severity) |"' trivy.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]?.Vulnerabilities[]?
                 | "::warning file=package-lock.json,title=\(.Severity) en \(.PkgName) \(.InstalledVersion)::\(.VulnerabilityID) \((.Title // "") | gsub("\n"; " ")). Corregida en \(.FixedVersion // "sin version corregida")"' trivy.json

  # Estatico: patrones explotables en el codigo fuente.
  # Compuerta informativa. Si se decide no corregir un hallazgo, la anotacion
  # va junto a la linea:
  # // nosemgrep: <regla> -- razon: ... | responsable: ... | vence: AAAA-MM-DD
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Analizar el codigo fuente
        run: |
          docker run --rm \
            --volume "${PWD}:/src" \
            --workdir /src \
            --env SEMGREP_SEND_METRICS=off \
            semgrep/semgrep \
            semgrep scan \
              --config=p/default \
              --config=p/javascript \
              --json --quiet \
              --output=semgrep.json \
              src/

      - name: Hallazgos visibles en la ejecucion
        if: always()
        run: |
          [ -f semgrep.json ] || exit 0
          n=$(jq '.results | length' semgrep.json)
          echo "## Analisis estatico: $n hallazgo(s)" >> "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 0 ] && exit 0
          {
            echo "| Regla | Archivo | Linea | Severidad |"
            echo "|---|---|---|---|"
            jq -r '.results[] | "| \(.check_id | split(".") | last) | \(.path) | \(.start.line) | \(.extra.severity) |"' semgrep.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "::warning file=\(.path),line=\(.start.line),title=\(.check_id | split(".") | last)::\(.extra.message | gsub("\n"; " "))"' semgrep.json

  # TODO
  # Construir la imagen de la aplicacion y publicarla en el registro privado.
  #
  # Depende de los cuatro jobs anteriores y corre solo desde la rama principal.
  #
  # La imagen se publica con tres tags independientes sobre el mismo manifiesto:
  # el sha corto del commit, la version y el ambiente.
  #
  #   - El sha es el tag con el que se publica. Nace del commit, siempre
  #     existe y no se reasigna nunca.
  #   - La version identifica el artefacto para las personas y tampoco se
  #     reasigna.
  #   - El de ambiente se reasigna en cada publicacion y siempre apunta a lo
  #     ultimo publicado para ese ambiente.
  #
  # Los dos ultimos se apuntan al manifiesto ya publicado. Agregar un tag a
  # una imagen publicada no reenvia capas.
  #
  # La construccion es para linux/amd64 y declara el label
  # org.opencontainers.image.title con el nombre de la aplicacion.
  #
  # Condicion de detencion: cualquier fallo de construccion o de publicacion.
  #
  # El job desplegar consume la salida 'digest' de este job. El formato es
  # <registro>/<aplicacion>@sha256:... Exponer solo el sha del digest, o
  # nombrar la salida de otra manera, rompe el despliegue.
  #
  # outputs:
  #   digest: # TODO
  #
  # Sustituir el paso centinela por la implementacion.
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Sin implementar
        run: |
          echo "::error::El job 'publicar' no esta implementado."
          exit 1

  # Este job viene completo y no se modifica.
  # Las estrategias de despliegue y la verificacion posterior son contenido
  # de la sesion 6. La pregunta de reflexion 2 pide leerlo.
  desplegar:
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Credenciales temporales
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Actualizar la funcion por digest
        run: |
          aws lambda update-function-code \
            --function-name inf384-lab3 \
            --image-uri ${{ needs.publicar.outputs.digest }}

      - name: Esperar a que la actualizacion termine
        run: aws lambda wait function-updated --function-name inf384-lab3