  # Compuerta informativa: el resultado queda en SonarQube Cloud y en el resumen.
  calidad:
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo para identificar codigo nuevo

      - name: Descargar el reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage/

      - name: Analisis en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        continue-on-error: true   # informa, no detiene
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORG }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true

      - name: Resultado visible en la ejecucion
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PROJECT: ${{ vars.SONAR_PROJECT_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR" ]; then q="projectKey=$PROJECT&pullRequest=$PR"
          else q="projectKey=$PROJECT&branch=$GITHUB_REF_NAME"; fi
          status=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/qualitygates/project_status?$q" \
            | jq -r '.projectStatus.status // "DESCONOCIDO"')
          url="https://sonarcloud.io/dashboard?id=$PROJECT"
          {
            echo "## Calidad (SonarQube Cloud)"
            echo "Quality gate: **$status** · [Ver el analisis]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != "OK" ]; then
            echo "::warning title=Quality gate: $status::El codigo nuevo no cumple la quality gate. Detalle en $url"
          fi

  # Unica compuerta que detiene: cualquier hallazgo falla el job.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo, no solo el ultimo commit

      - name: Gitleaks sobre el historial completo
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git /repo --redact --no-banner \
            --report-format json --report-path /repo/gitleaks.json \
            --exit-code 1

      - name: Hallazgos visibles en la ejecucion
        if: always()
        run: |
          [ -f gitleaks.json ] || exit 0
          n=$(jq length gitleaks.json)
          echo "## Secretos: $n hallazgo(s)" >> "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 0 ] && exit 0
          {
            echo "| Regla | Archivo | Linea | Commit |"
            echo "|---|---|---|---|"
            jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:7]) |"' gitleaks.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=Secreto (\(.RuleID))::Credencial en el commit \(.Commit[0:7]). Retirar del codigo y del historial, y rotar en el origen."' gitleaks.json

  # Compuerta informativa sobre el arbol completo del lock file.
  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Excepciones (si se decide no corregir), una por linea:
      # <ID del hallazgo> | razon: ... | responsable: ... | vence: AAAA-MM-DD
      - name: npm audit sobre el arbol completo
        run: |
          # Sin --omit=dev: el alcance incluye las dependencias de desarrollo
          npm audit --package-lock-only --json > audit.json || true
          n=$(jq '.metadata.vulnerabilities.total' audit.json)
          echo "## Dependencias: $n vulnerabilidad(es)" >> "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 0 ] && exit 0
          {
            echo "| Paquete | Severidad | Rango | Aviso |"
            echo "|---|---|---|---|"
            jq -r '.vulnerabilities[] | .name as $p | .via[] | objects
                   | "| \($p) | \(.severity) | \(.range) | [\(.title)](\(.url)) |"' audit.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.vulnerabilities[] | .name as $p | .via[] | objects
                 | "::warning file=package-lock.json,title=\(.severity) en \($p)::\(.title) \(.url)"' audit.json

  # Compuerta informativa: patrones explotables en el codigo fuente.
  estatico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep sobre src/
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.100.0 \
            semgrep scan --config p/javascript --config p/nodejsscan \
            --metrics=off --json --output semgrep.json src/ || true
          n=$(jq '.results | length' semgrep.json)
          echo "## Analisis estatico: $n hallazgo(s)" >> "$GITHUB_STEP_SUMMARY"
          [ "$n" -eq 0 ] && exit 0
          {
            echo "| Regla | Archivo | Linea | Severidad |"
            echo "|---|---|---|---|"
            jq -r '.results[] | "| \(.check_id | split(".") | last) | \(.path) | \(.start.line) | \(.extra.severity) |"' semgrep.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | "::warning file=\(.path),line=\(.start.line),title=\(.check_id | split(".") | last)::\(.extra.message | gsub("\n"; " "))"' semgrep.json